name: Render KiCad schematics

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "hardware/**/*.kicad_sch"
      - ".github/workflows/render-kicad.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install KiCad 10
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository --yes ppa:kicad/kicad-10.0-releases
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends kicad

      - name: Export schematic previews
        shell: bash
        run: |
          set -euo pipefail

          rm -rf assets/schematics .kicad-render
          mkdir -p assets/schematics .kicad-render

          render_schematic() {
            source_file="$1"
            output_name="$2"
            output_dir=".kicad-render/$output_name"

            mkdir -p "$output_dir"

            kicad-cli sch export svg \
              --pages 1 \
              --exclude-drawing-sheet \
              --output "$output_dir" \
              "$source_file"

            rendered_file="$(find "$output_dir" -maxdepth 1 -type f -name '*.svg' | head -n 1)"

            if [ -z "$rendered_file" ]; then
              echo "No SVG generated for $source_file"
              exit 1
            fi

            python3 - "$rendered_file" <<'PY'
          import re
          import sys
          from pathlib import Path
          
          path = Path(sys.argv[1])
          svg = path.read_text()
          match = re.search(r"<svg\b[^>]*>", svg, re.DOTALL)
          if match is None:
              raise SystemExit(f"Could not find SVG root in {path}")
          
          background = '<rect x="0" y="0" width="100%" height="100%" fill="#ffffff"/>'
          if background not in svg:
              svg = svg[:match.end()] + "\n  " + background + svg[match.end():]
          path.write_text(svg)
          PY
            cp "$rendered_file" "assets/schematics/$output_name.svg"
          }

          render_schematic "hardware/clock/clock.kicad_sch" "clock"
          render_schematic "hardware/ram-registers/ram.kicad_sch" "ram"
          render_schematic "hardware/ram-registers/registers.kicad_sch" "registers"
          render_schematic "hardware/ram-registers/instruction-register.kicad_sch" "instruction-register"
          render_schematic "hardware/ram-registers/product-register.kicad_sch" "product-register"
          render_schematic "hardware/ram-registers/program-counter.kicad_sch" "program-counter"
          render_schematic "hardware/output/output.kicad_sch" "output"
          render_schematic "hardware/control-logic/control-logic.kicad_sch" "control-logic"

          rm -rf .kicad-render

      - name: Commit generated previews
        shell: bash
        run: |
          git config user.name "Ahmed Youssef Youssef Mansour Bosha"
          git config user.email "123402823+R3Dzf@users.noreply.github.com"

          git add assets/schematics

          if git diff --cached --quiet; then
            echo "Schematic previews are already up to date."
            exit 0
          fi

          git commit -m "Render KiCad schematic previews"
          git pull --rebase origin main
          git push
